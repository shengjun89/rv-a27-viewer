<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="description" content="大通V80房车A27活动部件交互模型">
  <title>A27 · 房车活动模型</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="viewer" aria-label="房车三维模型，拖动旋转，双指缩放或平移"></main>

  <nav class="tool-bar" aria-label="模型预览工具">
    <button id="reset" aria-label="复位模型和视角" title="复位">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 10a8 8 0 1 1 .5 6M4 4v6h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="top-view" aria-label="切换俯视预览" title="俯视">
      <svg viewBox="0 0 24 24" fill="none"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <span aria-hidden="true"></span>
    <button id="zoom-in" aria-label="放大模型" title="放大">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button id="zoom-out" aria-label="缩小模型" title="缩小">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button id="share" aria-label="分享模型" title="分享">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V3m-4 4 4-4 4 4M6 11H4v10h16V11h-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <p class="gesture">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M5 10V4a1.5 1.5 0 0 1 3 0v5l1-1c1-1 2 0 2 0l1-1 3 2v4l-2 4H8l-4-5c-1-2 0-3 1-2Z" stroke="currentColor" stroke-width="1.1"/>
    </svg>
    拖动旋转 · 双指缩放 / 平移
  </p>

  <div id="loading" role="status">
    <span>A27</span>
    <p id="loading-detail">正在载入活动模型…</p>
    <i><b id="progress"></b></i>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
